<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefas da casa</title>
<style>
  :root{
    --bg: #1b1a17;
    --panel: #242220;
    --panel-hi: #2c2a26;
    --line: #3a3733;
    --text: #ece7de;
    --text-dim: #a39c8f;
    --accent: #c98a3e;
    --accent-soft: rgba(201,138,62,0.15);
    --done: #6b8f6a;
    --tag-organizar: #7f9cc4;
    --tag-comprar: #c9a13e;
    --tag-fazer: #8fa876;
    --tag-contratar: #c46b5f;
    --tag-decidir: #a884c4;
    --radius: 10px;
    font-family: 'Iowan Old Style', 'Georgia', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    padding: 28px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{max-width: 640px; margin: 0 auto;}
  header{margin-bottom: 18px;}
  h1{
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 0.92rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .save-state{
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top: 6px;
    min-height: 1em;
  }
  .save-state.error{ color: var(--tag-contratar); }
  .progress-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .progress-track{
    flex:1;
    height: 6px;
    background: var(--line);
    border-radius: 4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width 0.4s ease;
  }
  .progress-label{
    font-size:0.8rem;
    color: var(--text-dim);
    white-space:nowrap;
  }
  .view-toggle{
    display:flex;
    gap: 6px;
    margin: 18px 0 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .view-btn{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .view-btn.active{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight:600;
  }
  .filters{
    display:flex;
    gap:8px;
    margin: 0 0 20px;
    flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .filter-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .filter-btn.active{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .room{
    margin-bottom: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .room-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 13px 16px;
    cursor:pointer;
    user-select:none;
    gap: 12px;
  }
  .room-title-wrap{ min-width:0; }
  .room-title{
    font-size: 1.02rem;
    font-weight:600;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .room-count{
    font-size:0.75rem;
    color: var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:400;
  }
  .room-desc{
    font-size: 0.76rem;
    color: var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top: 3px;
    line-height:1.4;
  }
  .chevron{
    color: var(--text-dim);
    transition: transform 0.2s ease;
    font-size: 0.8rem;
    flex-shrink:0;
  }
  .room.collapsed .chevron{ transform: rotate(-90deg); }
  .room-body{
    border-top: 1px solid var(--line);
  }
  .room.collapsed .room-body{ display:none; }
  ul.tasks{
    list-style:none;
    margin:0;
    padding: 6px 8px;
  }
  li.task{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: grab;
    transition: background 0.15s ease;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  li.task:hover{ background: var(--panel-hi); }
  li.task.dragging{ opacity: 0.4; }
  li.task.drag-over{ box-shadow: inset 0 2px 0 var(--accent); }
  .drag-handle{
    color: var(--text-dim);
    font-size: 0.9rem;
    padding-top: 2px;
    letter-spacing: -1px;
    line-height: 1;
  }
  .checkbox{
    width: 19px;
    height: 19px;
    min-width:19px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    margin-top: 1px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.15s ease;
    background: transparent;
  }
  .checkbox.checked{
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox.checked::after{
    content:"\2713";
    color: #16201a;
    font-size: 12px;
    font-weight:bold;
  }
  .task-main{ flex:1; min-width:0; }
  .task-label{
    font-size: 0.93rem;
    line-height:1.4;
  }
  .task.done .task-label{
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }
  .pill-row{
    display:flex;
    gap: 6px;
    margin-top: 5px;
    flex-wrap:wrap;
  }
  .tag{
    display:inline-block;
    font-size: 0.66rem;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .tag-organizar{ background: rgba(127,156,196,0.15); color: var(--tag-organizar); }
  .tag-comprar{ background: rgba(201,161,62,0.15); color: var(--tag-comprar); }
  .tag-fazer{ background: rgba(143,168,118,0.15); color: var(--tag-fazer); }
  .tag-contratar{ background: rgba(196,107,95,0.15); color: var(--tag-contratar); }
  .tag-decidir{ background: rgba(168,132,196,0.15); color: var(--tag-decidir); }
  .tag-room{
    background: var(--line);
    color: var(--text-dim);
  }
  .empty-hint{
    text-align:center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .reset-row{
    text-align:center;
    margin-top: 30px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .reset-btn{
    background:none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    cursor:pointer;
  }
  .reset-btn:hover{ color: var(--text); border-color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tarefas da casa</h1>
    <div class="subtitle">Arraste pra reordenar por prioridade dentro do grupo. Toque pra marcar feito.</div>
    <div class="save-state" id="saveState"></div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>
  </header>

  <div class="view-toggle" id="viewToggle"></div>
  <div class="filters" id="filters"></div>

  <div id="rooms"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reiniciar tudo</button>
  </div>
</div>

<script>
// Persistence shim: talks to the box-fiesta server so the list survives restarts.
// GET  /tarefas/state/:key  -> { value: string | null }
// PUT  /tarefas/state/:key  -> persists { value } to server/data/tarefas-casa.json
window.storage = {
  async get(key){
    const res = await fetch('/tarefas/state/' + encodeURIComponent(key), { cache: 'no-store' });
    if(res.status === 404) return null;
    if(!res.ok) throw new Error('storage get failed: ' + res.status);
    return res.json();
  },
  async set(key, value){
    const res = await fetch('/tarefas/state/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ value: String(value) })
    });
    if(!res.ok) throw new Error('storage set failed: ' + res.status);
  }
};
</script>

<script>
const STORAGE_KEY = 'tarefas-casa-v3';

const TAG_LABEL = {
  organizar: 'organizar',
  comprar: 'comprar',
  fazer: 'fazer',
  contratar: 'contratar',
  decidir: 'decidir'
};

const TIPO_META = {
  agora: { label: 'Fazer agora', desc: 'Rápido, sem depender de ninguém — só começar.' },
  ligar: { label: 'Ligar / orçar', desc: 'Lembrete recorrente até resolver. Ligar à tarde — evitar segunda e quinta.' },
  agendar: { label: 'Marcar dia específico', desc: 'Já tem orçamento — só falta escolher a data e bloquear.' },
  decidir: { label: 'Decidir (sem pressa)', desc: 'Pensar quando bater vontade. Não trava o resto.' },
  comprar: { label: 'Lista de compras', desc: 'Resolver numa leva só — online ou numa ida a loja.' }
};

const ROOM_ORDER = ['Suíte', 'Quarto dos fundos', 'Quarto pequeno', 'Banheiro', 'Cozinha', 'Sala', 'Quintal', 'Geral / casa toda'];
const TIPO_ORDER = ['agora', 'ligar', 'agendar', 'decidir', 'comprar'];

const DEFAULT_ITEMS = [
  { text: 'Furar parede pra TV', room: 'Suíte', tag: 'contratar', tipo: 'agendar' },
  { text: 'Ver box novo', room: 'Suíte', tag: 'comprar', tipo: 'comprar' },
  { text: 'Ver criado-mudo', room: 'Suíte', tag: 'comprar', tipo: 'comprar' },
  { text: 'Arrumar led da cama', room: 'Suíte', tag: 'fazer', tipo: 'agora' },
  { text: 'Pensar no design do quarto', room: 'Suíte', tag: 'decidir', tipo: 'decidir' },
  { text: 'Ver tinta pra pintar o quarto', room: 'Suíte', tag: 'decidir', tipo: 'decidir' },

  { text: 'Mover móveis do escritório pro quarto dos fundos', room: 'Quarto dos fundos', tag: 'fazer', tipo: 'agora' },
  { text: 'Arrumar guarda-roupa', room: 'Quarto dos fundos', tag: 'organizar', tipo: 'agora' },
  { text: 'Arrumar quarto dos fundos (depois da troca)', room: 'Quarto dos fundos', tag: 'organizar', tipo: 'agora' },
  { text: 'Ver tinta pra pintar escritório', room: 'Quarto dos fundos', tag: 'decidir', tipo: 'decidir' },
  { text: 'Ver cortina do escritório', room: 'Quarto dos fundos', tag: 'comprar', tipo: 'comprar' },

  { text: 'Mover coisas de obra pro quarto pequeno', room: 'Quarto pequeno', tag: 'fazer', tipo: 'agora' },
  { text: 'Gaveteiro pras coisas de obra', room: 'Quarto pequeno', tag: 'organizar', tipo: 'agora' },
  { text: 'Arrumar quarto pequeno (depois da troca)', room: 'Quarto pequeno', tag: 'organizar', tipo: 'agora' },

  { text: 'Limpar teto do banheiro', room: 'Banheiro', tag: 'fazer', tipo: 'agora' },
  { text: 'Pintar teto do banheiro', room: 'Banheiro', tag: 'fazer', tipo: 'agendar' },
  { text: 'Usar tinta de rejunte', room: 'Banheiro', tag: 'fazer', tipo: 'agora' },

  { text: 'Ver led da cozinha', room: 'Cozinha', tag: 'comprar', tipo: 'comprar' },
  { text: 'Pesquisar/orçar quebra da parede (cozinha aberta)', room: 'Cozinha', tag: 'contratar', tipo: 'ligar' },
  { text: 'Arrumar cano do filtro d’água', room: 'Cozinha', tag: 'contratar', tipo: 'ligar' },
  { text: 'Colocar filtro na caixa d’água', room: 'Cozinha', tag: 'comprar', tipo: 'comprar' },

  { text: 'Jogar fora sofá', room: 'Sala', tag: 'fazer', tipo: 'agora' },
  { text: 'Arrumar puff (colar + comprar enchimento)', room: 'Sala', tag: 'comprar', tipo: 'comprar' },

  { text: 'Pesquisar/orçar teto do quintal', room: 'Quintal', tag: 'contratar', tipo: 'ligar' },
  { text: 'Planejar/orçar tanquinho', room: 'Quintal', tag: 'contratar', tipo: 'ligar' },

  { text: 'Arrumar luneta (colar)', room: 'Geral / casa toda', tag: 'fazer', tipo: 'agora' },
  { text: 'Ligar pro chaveiro (interfone bugando + novo botão)', room: 'Geral / casa toda', tag: 'contratar', tipo: 'ligar' },
  { text: 'Arrumar fios do roteador', room: 'Geral / casa toda', tag: 'organizar', tipo: 'agora' },
  { text: 'Limpar notebook', room: 'Geral / casa toda', tag: 'fazer', tipo: 'agora' },
  { text: 'Arrumar pendurador de óculos', room: 'Geral / casa toda', tag: 'fazer', tipo: 'agora' },
  { text: 'Organizar fios do dia a dia', room: 'Geral / casa toda', tag: 'organizar', tipo: 'agora' },
];

function makeIds(items){
  return items.map((it, idx) => ({ id: 'item-' + idx, ...it, done: false }));
}

let items = null;
let collapsedGroups = {};
let viewMode = 'tipo'; // 'tipo' | 'room'
let activeFilter = 'all';

function setSaveState(text, isError){
  const el = document.getElementById('saveState');
  el.textContent = text;
  el.classList.toggle('error', !!isError);
}

async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      items = parsed.items;
      collapsedGroups = parsed.collapsedGroups || {};
      viewMode = parsed.viewMode || 'tipo';
      return;
    }
  }catch(e){ /* not found yet */ }
  items = makeIds(DEFAULT_ITEMS);
  await saveState();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({ items, collapsedGroups, viewMode }), false);
    const now = new Date();
    setSaveState('Salvo no servidor · ' + now.toLocaleTimeString('pt-BR'));
  }catch(e){
    console.error('Falha ao salvar', e);
    setSaveState('Não consegui salvar no servidor — verifique se ele está no ar.', true);
  }
}

function renderViewToggle(){
  const el = document.getElementById('viewToggle');
  el.innerHTML = '';
  const opts = [
    { key: 'tipo', label: 'Por tipo de ação' },
    { key: 'room', label: 'Por cômodo' }
  ];
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'view-btn' + (viewMode === opt.key ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = () => { viewMode = opt.key; saveState(); render(); };
    el.appendChild(btn);
  });
}

function renderFilters(){
  const filters = document.getElementById('filters');
  const options = [
    { key: 'all', label: 'Tudo' },
    { key: 'pending', label: 'A fazer' },
  ];
  filters.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeFilter === opt.key ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = () => { activeFilter = opt.key; render(); };
    filters.appendChild(btn);
  });
}

function updateProgress(){
  const total = items.length;
  const done = items.filter(it => it.done).length;
  document.getElementById('progressFill').style.width = total ? (done/total*100) + '%' : '0%';
  document.getElementById('progressLabel').textContent = done + ' / ' + total;
}

let dragInfo = null;

function groupKeyOf(item){ return viewMode === 'tipo' ? item.tipo : item.room; }
function groupOrder(){ return viewMode === 'tipo' ? TIPO_ORDER : ROOM_ORDER; }
function groupLabel(key){ return viewMode === 'tipo' ? TIPO_META[key].label : key; }
function groupDesc(key){ return viewMode === 'tipo' ? TIPO_META[key].desc : null; }

function render(){
  renderViewToggle();
  renderFilters();
  updateProgress();
  const roomsEl = document.getElementById('rooms');
  roomsEl.innerHTML = '';

  groupOrder().forEach(groupKey => {
    const groupItems = items.filter(it => groupKeyOf(it) === groupKey);
    if(groupItems.length === 0) return;
    const visibleItems = groupItems.filter(it => activeFilter === 'pending' ? !it.done : true);
    if(visibleItems.length === 0) return;

    const collapseId = viewMode + ':' + groupKey;
    const isCollapsed = !!collapsedGroups[collapseId];

    const roomEl = document.createElement('div');
    roomEl.className = 'room' + (isCollapsed ? ' collapsed' : '');

    const doneCount = groupItems.filter(it => it.done).length;
    const desc = groupDesc(groupKey);

    const headerEl = document.createElement('div');
    headerEl.className = 'room-header';
    headerEl.innerHTML = `
      <div class="room-title-wrap">
        <div class="room-title">${groupLabel(groupKey)} <span class="room-count">${doneCount}/${groupItems.length}</span></div>
        ${desc ? `<div class="room-desc">${desc}</div>` : ''}
      </div>
      <div class="chevron">▾</div>
    `;
    headerEl.onclick = () => { collapsedGroups[collapseId] = !isCollapsed; saveState(); render(); };
    roomEl.appendChild(headerEl);

    const bodyEl = document.createElement('div');
    bodyEl.className = 'room-body';
    const ul = document.createElement('ul');
    ul.className = 'tasks';

    visibleItems.forEach(item => {
      const li = document.createElement('li');
      li.className = 'task' + (item.done ? ' done' : '');
      li.draggable = true;
      li.dataset.id = item.id;

      const secondaryPill = viewMode === 'tipo'
        ? `<span class="tag tag-room">${item.room}</span>`
        : `<span class="tag tag-${item.tag}">${TAG_LABEL[item.tag]}</span>`;

      li.innerHTML = `
        <span class="drag-handle">⠿</span>
        <div class="checkbox ${item.done ? 'checked' : ''}"></div>
        <div class="task-main">
          <div class="task-label">${escapeHtml(item.text)}</div>
          <div class="pill-row">${secondaryPill}</div>
        </div>
      `;

      li.querySelector('.checkbox').onclick = (e) => {
        e.stopPropagation();
        item.done = !item.done;
        saveState();
        render();
      };

      li.addEventListener('dragstart', (e) => {
        dragInfo = { groupKey, id: item.id };
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });
      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        if(!dragInfo || dragInfo.groupKey !== groupKey) return;
        li.classList.add('drag-over');
      });
      li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('drag-over');
        if(!dragInfo || dragInfo.groupKey !== groupKey) return;
        const fromIdx = items.findIndex(it => it.id === dragInfo.id);
        const toIdx = items.findIndex(it => it.id === item.id);
        if(fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
        const [moved] = items.splice(fromIdx, 1);
        const newToIdx = items.findIndex(it => it.id === item.id);
        items.splice(newToIdx, 0, moved);
        saveState();
        render();
      });

      ul.appendChild(li);
    });

    bodyEl.appendChild(ul);
    roomEl.appendChild(bodyEl);
    roomsEl.appendChild(roomEl);
  });

  if(roomsEl.children.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Nada por aqui com esse filtro.';
    roomsEl.appendChild(hint);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('resetBtn').onclick = async () => {
  if(!confirm('Reiniciar tudo? Isso apaga o progresso salvo no servidor.')) return;
  items = makeIds(DEFAULT_ITEMS);
  collapsedGroups = {};
  await saveState();
  render();
};

(async () => {
  await loadState();
  render();
})();
</script>
</body>
</html>
